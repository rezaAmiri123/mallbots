version: "3.8"

x-environment: &default-environment
  SECRET_KEY: secret
  EVENT_DRIVER: nats
  NATS_URL: stan:4222
  NATS_STREAM: ftgogo
  NATS_CLUSTER_ID: test-cluster
  PG_DRIVER: pgx
  PG_HOST: postgesql
  PG_PORT: 5432
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
  # GET_HOSTS_FROM: dns
  ENVIRONMENT: development
  LOG_LEVEL: TRACE
  WEB_API_PATH: /api/v1
  # WEB_HTTP_PORT: 9000
  RPC_ADDRESS: :8000
  RESTAURANT_ADDRESS: restaurant:8000
  CONSUMER_ADDRESS: consumer:8000
  ORDER_ADDRESS: order:8000
  ORDER_HISTORY_ADDRESS: order-history:8000
  KITCHEN_ADDRESS: kitchen:8000
  ACCOUNTING_ADDRESS: accounting:8000
  DELIVERY_ADDRESS: delivery:8000

services:
  # consumer:
  #   container_name: consumer
  #   hostname: consumer
  #   image: ftgogo-consumer
  #   build:
  #     context: consumer
  #     args:
  #       SERVICE: consumer
  #   expose:
  #     - '8000'
  #   environment:  
  #     <<: *default-environment
  #     SERVICE_ID: consumer-docker
  #     PG_CONN: 'host=postgres dbname=consumer user=consumer_user password=consumer_pass pool_max_conns=10'
  #     OTEL_SERVICE_NAME: consumer
  #   depends_on:
  #     - stan
  #     - postgres
  #   networks: [ "mallbots" ]
  #   command: [ "./wait-for", "postgres:5432", "--", "/app/main" ]

  jaeger:
    container_name: jaeger
    restart: always
    image: jaegertracing/all-in-one:1.21
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    hostname: jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks: [ "mallbots" ]
    # profiles: [ microservices ]

  prometheus:
    image: prom/prometheus:v2.37.1
    container_name: microservice_prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus-config.yml
    volumes:
      - ./docker/prometheus/prometheus-config.yml:/etc/prometheus/prometheus-config.yml
    networks: [ "mallbots" ]
    # profiles: [ microservices ]    
#  node_exporter:
#    container_name: node_exporter_container
#    restart: always
#    image: prom/node-exporter
#    ports:
#      - '9101:9100'
#    networks: [ "microservices" ]

  grafana:
    container_name: grafana
    hostname: grafana
    image: grafana/grafana:9.0.9
    volumes:
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./docker/grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "3000:3000"
    networks: [ "mallbots" ]
    
  collector:
    container_name: collector
    hostname: collector
    image: otel/opentelemetry-collector-contrib:0.60.0
    command: [
      "--config=/etc/otel-config.yml",
    ]
    volumes:
      - ./docker/otel/otel-config.yml:/etc/otel-config.yml
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP http receiver
  #      - "55679:55679" # zpages extension
    depends_on:
      - prometheus
      - jaeger

    networks: [ "mallbots" ]
    # profiles: [ microservices ]

  postgres:
    container_name: postgres
    hostname: postgres
    image: postgres:14-alpine
    restart: always
    environment:
      # GET_HOST_FROM: dns
      POSTGRES_PASSWORD: itsasecret
    networks:
      - mallbots
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata2:/var/lib/postgresql/data'
      - './docker/database:/docker-entrypoint-initdb.d'
  nats:
    container_name: nats
    hostname: nats
    image: nats:2-alpine
    ports:
      - '4222:4222'
      - '8222:8222'
    command:
      - -js
      - -sd
      - /var/lib/nats/data
      - -m 
      - '8222'
    volumes:
      - 'jsdata:/var/lib/nats/data'
    networks: [ "mallbots" ]

networks:
  mallbots:

volumes:
  pgdata2:
  jsdata:
  
