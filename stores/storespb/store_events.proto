syntax = "proto3";

package storespb;
option go_package = "github.com/rezaAmiri123/mallbots/stores/storespb";


message StoreCreated {
    string id = 1;
    string name = 2;
    string location = 3;
  }
  
  message StoreParticipationToggled {
    string id = 1;
    bool participating = 2;
  }
  
  message StoreRebranded {
    string id = 1;
    string name = 2;
  }
  
  message ProductAdded {
    string id = 1;
    string store_id = 2;
    string name = 3;
    string description = 4;
    string sku = 5;
    double price = 6;
  }
  
  message ProductRebranded {
    string id = 1;
    string name = 2;
    string description = 3;
  }
  
  message ProductPriceChanged {
    string id = 1;
    double delta = 2;
  }
  
  message ProductRemoved {
    string id = 1;
  }
  